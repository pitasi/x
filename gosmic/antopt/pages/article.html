<!DOCTYPE html>
<html lang="en">
  <head>
    {{ template "base-headers" .BaseHeaders }}
    <title>{{ .Article.Title }} — anto.pt</title>
    <meta name="description" content="{{ .Article.Description }}">
    <meta property="og:site_name" content="Antonio Pitasi">
    <meta property="og:url" content="https://anto.pt/articles/{{ .Article.Slug }}">
    <meta property="og:title" content="{{ .Article.Title }}">
    <meta property="og:description" content="{{ .Article.Description }}">
    <meta property="og:type" content="article">
    <meta property="og:image" content="https://anto.pt/articles/covers/{{ .Article.Slug }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://anto.pt/articles/covers/{{ .Article.Slug }}">
    <meta name="twitter:site" content="@zaphodias">
    <meta name="twitter:creator" content="@zaphodias">
    <meta name="twitter:title" content="{{ .Article.Title }}">
    <meta name="twitter:description" content="{{ .Article.Description }}">
  </head>
  <body>
    <div class="content">
      {{ template "nav.html" .Nav }}
      <main class="wrap">
        {{ template "now-playing" }}

        <a class="backlink" href="/">← ~/writing</a>

        <article>
          <header class="post-head">
            <h1 class="post-title">{{ .Article.Title }}</h1>
            <div class="post-meta">
              <time datetime="{{ .Article.Date.Format "2006-01-02" }}">{{ .Article.Date.Format "2006-01-02" }}</time>
            </div>
          </header>

          <div class="prose">
            {{ .Article.Content }}
          </div>
        </article>

        {{ template "intro.html" }}
      </main>
      {{ template "footer.html" . }}
    </div>
  </body>
</html>
