<div class="color-picker">
    <button class="toggle" id="toggleBtn" aria-label="Change background color" title="Change background color"></button>
    <dialog id="colorDialog">
        <div class="color-options">
            <button class="color-option" id="colorClose" aria-label="Close background color picker">×</button>
            {{ range .Colors }}
            <button
                {{ if eq $.Selected . }}
                class="color-option active"
                {{ else }}
                class="color-option"
                {{ end }}
                style="background-color: {{ . }}"
                data-color="{{ . }}"
                aria-label="Set background color"
            >{{ if eq $.Selected . }}✌️{{ end }}</button>
            {{ end }}
        </div>
    </dialog>

    <form
        id="colorForm"
        action="/submit-color"
        method="POST"
        style="display: none"
    >
        <input type="hidden" name="color" id="selectedColor">
        <input type="hidden" name="redirectTo" id="redirectTo">
    </form>

    <script>
        (function () {
            const toggleBtn = document.getElementById("toggleBtn");
            const colorDialog = document.getElementById("colorDialog");
            const colorOptions = document.querySelectorAll(".color-option");
            const colorForm = document.getElementById("colorForm");
            const selectedColorInput = document.getElementById("selectedColor");
            const redirectToInput = document.getElementById("redirectTo");
            redirectToInput.value = window.location.pathname;

            toggleBtn.addEventListener("click", () => {
                colorDialog.showModal();
                const r = toggleBtn.getBoundingClientRect();
                colorDialog.style.top = (r.bottom + 8) + "px";
                colorDialog.style.right = (window.innerWidth - r.right) + "px";
            });

            colorOptions.forEach((option) => {
                if (option.id === "colorClose") {
                    option.addEventListener("click", () => colorDialog.close());
                    return;
                }
                option.addEventListener("click", () => {
                    selectedColorInput.value = option.getAttribute("data-color");
                    colorForm.submit();
                    colorDialog.close();
                });
            });
        })();
    </script>
</div>
